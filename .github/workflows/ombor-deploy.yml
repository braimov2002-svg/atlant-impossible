name: Ombor deploy

# Publishes the warehouse system (apps/ombor) to Cloudflare Workers.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see apps/ombor/README.md). Without them the job does nothing.

on:
  push:
    branches: [main]
    paths: ['apps/ombor/**', '.github/workflows/ombor-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ombor-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that Cloudflare is set up
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not set; nothing was published."
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ok
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.ready.outputs.ok
      - name: Build
        if: steps.ready.outputs.ok
        run: npm run build -w @atlant/ombor
      - name: Find or create the database
        if: steps.ready.outputs.ok
        working-directory: apps/ombor
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(l.find(d=>d.name==="ombor")?.uuid??"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create ombor
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(l.find(d=>d.name==="ombor")?.uuid??"")')
          fi
          test -n "$id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - name: Update the database structure
        if: steps.ready.outputs.ok
        working-directory: apps/ombor
        run: npx wrangler d1 migrations apply ombor --remote
      - name: Publish
        if: steps.ready.outputs.ok
        working-directory: apps/ombor
        run: npx wrangler deploy
