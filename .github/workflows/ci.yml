name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, web build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build web app
        run: npm run build:web
      - name: Install Chromium for the web e2e test
        run: npx playwright install --with-deps chromium
      - name: Web e2e (fake microphone, mocked Gemini)
        run: npm run e2e:web
      - name: Desktop smoke test (Electron + fake microphone)
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run smoke:desktop

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
            builder_args: --mac
            cache_paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - name: Windows
            os: windows-2025
            builder_args: --win
            cache_paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
    env:
      # No Apple certificate: build.mac.identity "-" signs ad-hoc.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Without this, pull-request builds skip even ad-hoc signing and
      # the app would not launch on Apple Silicon.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_paths }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: npm ci --no-audit --no-fund
      - name: Build installers
        run: npm run dist -w @ovozyoz/desktop -- ${{ matrix.builder_args }}
      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="$(ls -d apps/desktop/release/mac*/OvozYoz.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep 'Signature=adhoc'
          lipo -archs "$APP/Contents/MacOS/OvozYoz" | grep x86_64 | grep arm64
          plutil -p "$APP/Contents/Info.plist" | grep -E 'LSUIElement|NSMicrophoneUsageDescription|NSAppleEventsUsageDescription'
      - uses: actions/upload-artifact@v7
        with:
          name: OvozYoz-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac.zip
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "OvozYoz $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    name: Deploy web app to GitHub Pages
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build for https://<owner>.github.io/<repo>/
        run: npm run build:web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
      - id: deploy
        uses: actions/deploy-pages@v5
